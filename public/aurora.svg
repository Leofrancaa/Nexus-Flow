<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMin slice" width="1200" height="600">
  <defs>
    <!-- Lima da marca, entrando pelo topo esquerdo -->
    <radialGradient id="a" cx="18%" cy="8%" r="62%">
      <stop offset="0%" stop-color="#D4FF00" stop-opacity=".30"/>
      <stop offset="45%" stop-color="#A3E635" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#A3E635" stop-opacity="0"/>
    </radialGradient>

    <!-- Teal frio equilibrando à direita -->
    <radialGradient id="b" cx="82%" cy="0%" r="58%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity=".24"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>

    <!-- Sopro quente no meio, para a malha não ficar bicolor -->
    <radialGradient id="c" cx="50%" cy="34%" r="46%">
      <stop offset="0%" stop-color="#FB923C" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#FB923C" stop-opacity="0"/>
    </radialGradient>

    <!-- Dissolve no fundo do app para não haver borda visível -->
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0A0A" stop-opacity="0"/>
      <stop offset="55%" stop-color="#0A0A0A" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="1"/>
    </linearGradient>

    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>

  <rect width="1200" height="600" fill="#0A0A0A"/>

  <g filter="url(#soft)">
    <rect width="1200" height="600" fill="url(#a)"/>
    <rect width="1200" height="600" fill="url(#b)"/>
    <rect width="1200" height="600" fill="url(#c)"/>
    <!-- Duas faixas difusas dão direção à malha, evitando o look de blob simétrico -->
    <ellipse cx="330" cy="120" rx="300" ry="90" fill="#D4FF00" opacity=".13" transform="rotate(-14 330 120)"/>
    <ellipse cx="880" cy="200" rx="260" ry="70" fill="#2DD4BF" opacity=".10" transform="rotate(9 880 200)"/>
  </g>

  <rect width="1200" height="600" fill="url(#fade)"/>
</svg>
